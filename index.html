
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>APEX — Преміальні перевезення</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<!-- Leaflet CSS & JS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
  :root{
    --bg-0:#0D0D0D;
    --bg-card: rgba(255,255,255,0.03);
    --border-soft: rgba(255,255,255,0.08);
    --gold-1:#D4AF37;
    --gold-2:#E5C158;
    --platinum:#E5E5E5;
    --text-muted: rgba(229,229,229,0.55);
    --danger:#E5484D;
    --radius-lg: 20px;
    --radius-md: 14px;
    --radius-sm: 10px;
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}

  html,body{
    margin:0; padding:0;
    background: radial-gradient(circle at 50% 0%, #1a1a1a 0%, var(--bg-0) 55%);
    color: var(--platinum);
    font-family: 'Inter', -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  .app{ max-width: 560px; margin: 0 auto; padding: 20px 18px 40px; }
  .header{ text-align:center; padding: 10px 0 18px; }
  .logo{
    font-size: 34px; font-weight: 800; letter-spacing: 6px; margin: 0;
    background: linear-gradient(180deg, #F5DE9A 0%, var(--gold-1) 55%, #B8892C 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .tagline{ margin: 4px 0 0; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--text-muted); }

  /* MAP BLOCK */
  .map-card {
    border-radius: var(--radius-lg); border: 1px solid var(--border-soft);
    overflow: hidden; margin-bottom: 16px; position: relative; box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  #map { width: 100%; height: 220px; background: #1a1a1a; cursor: pointer; }

  /* FARE CALC BOX */
  .calc-box {
    background: rgba(212,175,55,0.06); border: 1px solid rgba(212,175,55,0.2);
    border-radius: var(--radius-md); padding: 14px 16px; display: flex;
    justify-content: space-between; align-items: center; margin-bottom: 20px;
  }
  .calc-info { font-size: 13px; color: var(--text-muted); }
  .calc-info strong { color: #fff; display: block; font-size: 15px; }
  .calc-price { font-size: 22px; font-weight: 800; color: var(--gold-2); }

  /* FORM */
  .form-card{
    border-radius: var(--radius-lg); background: var(--bg-card);
    border: 1px solid var(--border-soft); padding: 20px 18px; margin-bottom: 20px;
  }
  .section-title{
    font-size: 11px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase;
    color: var(--gold-2); margin: 0 0 14px; display:flex; align-items:center; gap: 8px;
  }
  .section-title::after{ content:''; flex:1; height:1px; background: var(--border-soft); }

  .mode-toggle { display: flex; gap: 8px; margin-bottom: 16px; }
  .mode-btn {
    flex: 1; padding: 10px; border-radius: var(--radius-sm);
    border: 1px solid var(--border-soft); background: rgba(255,255,255,0.02);
    color: var(--text-muted); font-size: 12px; font-weight: 600; cursor: pointer; text-align: center;
    transition: all .2s ease;
  }
  .mode-btn.active { border-color: var(--gold-1); background: rgba(212,175,55,0.12); color: var(--gold-2); }

  .field{ margin-bottom: 14px; position: relative; }
  .field-label{ display:block; font-size: 11px; font-weight: 500; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; }

  .input-with-btn {
    display: flex; gap: 8px; align-items: center;
  }

  input[type="text"], input[type="tel"], textarea, select{
    width: 100%; background: rgba(255,255,255,0.035);
    border: 1px solid var(--border-soft); border-radius: var(--radius-sm);
    color: #fff; font-size: 14px; padding: 12px; outline: none;
    transition: border-color .15s, background .15s;
    font-family: inherit;
  }
  textarea { resize: vertical; min-height: 60px; }
  select option { background: #141414; color: #fff; }
  input:focus, textarea:focus, select:focus{ border-color: var(--gold-1); background: rgba(212,175,55,0.05); }

  /* LOCATE BUTTON */
  .locate-btn {
    background: rgba(212,175,55,0.12); border: 1px solid var(--gold-1);
    color: var(--gold-2); border-radius: var(--radius-sm); padding: 12px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: background 0.2s ease, transform 0.1s ease; flex-shrink: 0;
  }
  .locate-btn:active { transform: scale(0.95); background: rgba(212,175,55,0.25); }

  input.field-error{ border-color: var(--danger) !important; background: rgba(229,72,77,0.06) !important; }
  .field-error-msg{ display:none; font-size: 11px; color: var(--danger); margin-top: 5px; }
  .field.has-error .field-error-msg{ display:block; }

  .fav-chips { display: flex; gap: 6px; margin-bottom: 10px; overflow-x: auto; padding-bottom: 4px; }
  .fav-chip {
    font-size: 11px; padding: 5px 10px; border-radius: 100px;
    border: 1px solid var(--border-soft); background: rgba(255,255,255,0.02);
    color: var(--text-muted); cursor: pointer; white-space: nowrap;
  }
  .fav-chip.geo-chip {
    border-color: rgba(212,175,55,0.4); color: var(--gold-2); background: rgba(212,175,55,0.08);
  }

  .add-stop-btn {
    background: none; border: none; color: var(--gold-2);
    font-size: 12px; font-weight: 600; cursor: pointer; padding: 4px 0;
    display: inline-flex; align-items: center; gap: 4px; margin-bottom: 12px;
  }

  .field-row{ display:flex; gap: 10px; }
  .field-row .field{ flex:1; }

  .submit-btn{
    width: 100%; border: none; border-radius: var(--radius-md); padding: 16px;
    font-size: 15px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
    color: #1a1300; background: linear-gradient(135deg, #F5DE9A 0%, var(--gold-1) 50%, #C69A2E 100%);
    box-shadow: 0 8px 24px rgba(212,175,55,0.25); cursor: pointer;
  }
  .submit-btn:disabled{ opacity: 0.6; cursor: default; }

  .toast{
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px);
    background: #1c1c1c; border: 1px solid var(--gold-1); color: #fff;
    padding: 12px 18px; border-radius: 12px; font-size: 13px;
    opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s;
    max-width: 90%; text-align: center; z-index: 9999;
  }
  .toast.show{ opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.error{ border-color: var(--danger); }
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <p class="logo">APEX</p>
    <p class="tagline">Reach the top</p>
  </div>

  <div class="map-card">
    <div id="map"></div>
  </div>

  <div class="calc-box">
    <div class="calc-info">
      <span id="distText">Вкажіть маршрут</span>
      <strong id="routeDetails">0 км · ~0 хв</strong>
    </div>
    <div class="calc-price" id="priceText">0 ₴</div>
  </div>

  <form id="orderForm" class="form-card" onsubmit="return false;">
    <p class="section-title">Тип поїздки</p>

    <div class="mode-toggle">
      <div class="mode-btn active" id="modeDistanceBtn">🚘 За маршрутом</div>
      <div class="mode-btn" id="modeHourlyBtn">⏱ Почасова оренда</div>
    </div>

    <div id="distanceFieldsBlock">
      <div class="fav-chips">
        <span class="fav-chip geo-chip" id="geoLocateChip">🎯 Моя геопозиція</span>
        <span class="fav-chip" data-addr="вул. Успенська, 138">📍 Успенська</span>
        <span class="fav-chip" data-addr="Парк Софіївка">🌳 Софіївка</span>
        <span class="fav-chip" data-addr="вул. Європейська, 1">🏢 Центр</span>
      </div>

      <div class="field" id="fromAddrField">
        <label class="field-label" for="fromAddr">Звідки (Точка А)</label>
        <div class="input-with-btn">
          <input type="text" id="fromAddr" placeholder="Адреса подачі">
          <button type="button" class="locate-btn" id="locateBtn" title="Визначити моє місцезнаходження">🎯</button>
        </div>
        <span class="field-error-msg">Вкажіть адресу подачі</span>
      </div>

      <div id="viaWrap" class="field" style="display:none;">
        <label class="field-label" for="viaAddr">Зупинка (Точка Б)</label>
        <input type="text" id="viaAddr" placeholder="Проміжна адреса">
      </div>

      <button type="button" id="addStopBtn" class="add-stop-btn">+ Додати зупинку</button>

      <div class="field" id="toAddrField">
        <label class="field-label" for="toAddr">Куди (Точка В)</label>
        <input type="text" id="toAddr" placeholder="Пункт призначення">
        <span class="field-error-msg">Вкажіть пункт призначення</span>
      </div>
    </div>

    <div id="hourlyFieldsBlock" style="display:none;">
      <div class="field" id="hourlyFromAddrField">
        <label class="field-label" for="hourlyFromAddr">Адреса подачі авто</label>
        <div class="input-with-btn">
          <input type="text" id="hourlyFromAddr" placeholder="Звідки забрати">
          <button type="button" class="locate-btn" id="locateHourlyBtn" title="Визначити моє місцезнаходження">🎯</button>
        </div>
        <span class="field-error-msg">Вкажіть адресу подачі авто</span>
      </div>
      <div class="field">
        <label class="field-label" for="hoursSelect">Тривалість оренди</label>
        <select id="hoursSelect">
          <option value="1">1 година</option>
          <option value="2" selected>2 години</option>
          <option value="3">3 години</option>
          <option value="4">4 години</option>
          <option value="6">6 годин</option>
          <option value="8">8 годин (Робочий день)</option>
        </select>
      </div>
    </div>

    <div class="field">
      <label class="field-label" for="orderComment">Коментар до замовлення</label>
      <textarea id="orderComment" placeholder="Під'їзд, під'їзні шляхи, дитяче крісло, багаж..."></textarea>
    </div>

    <p class="section-title" style="margin-top:20px;">Контакти</p>
    <div class="field-row">
      <div class="field" id="clientNameField">
        <label class="field-label" for="clientName">Ім'я</label>
        <input type="text" id="clientName" placeholder="Ваше ім'я">
        <span class="field-error-msg">Вкажіть ім'я</span>
      </div>
      <div class="field" id="clientPhoneField">
        <label class="field-label" for="clientPhone">Телефон</label>
        <input type="tel" id="clientPhone" placeholder="+380...">
        <span class="field-error-msg">Невірний номер телефону</span>
      </div>
    </div>
  </form>

  <button type="button" class="submit-btn" id="submitBtn">Замовити Apex</button>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  const BOT_TOKEN = "8645469518:AAFJtGa2ZBgzOh_-lrM58uwFTcSywaSRUEg";
  const DISPATCHER_CHAT_ID = "5585144477";

  const BASE_FARE = 100;
  const PER_KM = 55;
  const HOURLY_RATE = 1000;
  const UMAN_COORDS = [48.7484, 30.2218];

  const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
  if (tg) { tg.ready(); tg.expand(); }

  let isHourlyMode = false;
  let lastCalculatedPrice = 0;
  let lastRouteSummary = '';

  const map = L.map('map').setView(UMAN_COORDS, 13);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(map);

  let markers = [];
  let routePolyline = null;

  // ---------- LOCAL STORAGE LOAD ----------
  function loadSavedUserData() {
    const savedName = localStorage.getItem('apex_client_name');
    const savedPhone = localStorage.getItem('apex_client_phone');
    const savedFrom = localStorage.getItem('apex_last_from');
    const savedTo = localStorage.getItem('apex_last_to');

    if (savedName) document.getElementById('clientName').value = savedName;
    if (savedPhone) document.getElementById('clientPhone').value = savedPhone;
    if (savedFrom) document.getElementById('fromAddr').value = savedFrom;
    if (savedTo) document.getElementById('toAddr').value = savedTo;

    if (savedFrom || savedTo) {
      handleAddressInput();
    }
  }

  function saveUserData(name, phone, from, to) {
    localStorage.setItem('apex_client_name', name);
    localStorage.setItem('apex_client_phone', phone);
    if (from) localStorage.setItem('apex_last_from', from);
    if (to) localStorage.setItem('apex_last_to', to);
  }

  loadSavedUserData();

  function clearMapLayers() {
    markers.forEach(m => map.removeLayer(m));
    markers = [];
    if (routePolyline) { map.removeLayer(routePolyline); routePolyline = null; }
  }

  const modeDistanceBtn = document.getElementById('modeDistanceBtn');
  const modeHourlyBtn = document.getElementById('modeHourlyBtn');
  const distanceFieldsBlock = document.getElementById('distanceFieldsBlock');
  const hourlyFieldsBlock = document.getElementById('hourlyFieldsBlock');

  modeDistanceBtn.addEventListener('click', () => {
    isHourlyMode = false;
    modeDistanceBtn.classList.add('active');
    modeHourlyBtn.classList.remove('active');
    distanceFieldsBlock.style.display = 'block';
    hourlyFieldsBlock.style.display = 'none';
    clearFieldError('hourlyFromAddrField');
    handleAddressInput();
  });

  modeHourlyBtn.addEventListener('click', () => {
    isHourlyMode = true;
    modeHourlyBtn.classList.add('active');
    modeDistanceBtn.classList.remove('active');
    distanceFieldsBlock.style.display = 'none';
    hourlyFieldsBlock.style.display = 'block';
    clearFieldError('fromAddrField');
    clearFieldError('toAddrField');
    clearMapLayers();
    calculateHourlyPrice();
  });

  document.getElementById('hoursSelect').addEventListener('change', calculateHourlyPrice);

  function calculateHourlyPrice() {
    if (!isHourlyMode) return;
    const hours = parseInt(document.getElementById('hoursSelect').value, 10);
    const total = BASE_FARE + (hours * HOURLY_RATE);
    lastCalculatedPrice = total;
    lastRouteSummary = `${hours} год. оренди авто з водієм`;
    document.getElementById('distText').innerText = 'Почасова оренда';
    document.getElementById('routeDetails').innerText = lastRouteSummary;
    document.getElementById('priceText').innerText = `${total} ₴`;
  }

  // ---------- GEOLOCATION & REVERSE GEOCODING ----------

  async function reverseGeocode(lat, lng) {
    try {
      const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&accept-language=uk`);
      const data = await res.json();
      if (data && data.address) {
        const road = data.address.road || data.address.street || data.address.pedestrian || '';
        const houseNumber = data.address.house_number || '';
        if (road) {
          return houseNumber ? `${road}, ${houseNumber}` : road;
        }
      }
      return `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
    } catch(e) {
      console.error(e);
      return `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
    }
  }

  function getUserLocation() {
    const targetInputId = isHourlyMode ? 'hourlyFromAddr' : 'fromAddr';
    const targetFieldId = isHourlyMode ? 'hourlyFromAddrField' : 'fromAddrField';
    const inputEl = document.getElementById(targetInputId);

    showToast('Визначаємо вашу геолокацію...');

    if (!navigator.geolocation) {
      showToast('Геолокація не підтримується вашим пристроєм', true);
      return;
    }

    navigator.geolocation.getCurrentPosition(
      async (pos) => {
        const lat = pos.coords.latitude;
        const lng = pos.coords.longitude;

        const addressName = await reverseGeocode(lat, lng);
        inputEl.value = addressName;
        clearFieldError(targetFieldId);

        map.setView([lat, lng], 16);
        handleAddressInput();
        showToast('Геолокацію визначено!');
      },
      (err) => {
        console.error(err);
        showToast('Не вдалося отримати доступ до геолокації', true);
      },
      { enableHighAccuracy: true, timeout: 10000 }
    );
  }

  // Pick address by map click
  map.on('click', async (e) => {
    const lat = e.latlng.lat;
    const lng = e.latlng.lng;
    const addressName = await reverseGeocode(lat, lng);

    if (isHourlyMode) {
      document.getElementById('hourlyFromAddr').value = addressName;
      clearFieldError('hourlyFromAddrField');
    } else {
      if (!document.getElementById('fromAddr').value) {
        document.getElementById('fromAddr').value = addressName;
        clearFieldError('fromAddrField');
      } else {
        document.getElementById('toAddr').value = addressName;
        clearFieldError('toAddrField');
      }
    }
    handleAddressInput();
  });

  document.getElementById('locateBtn').addEventListener('click', getUserLocation);
  document.getElementById('locateHourlyBtn').addEventListener('click', getUserLocation);
  document.getElementById('geoLocateChip').addEventListener('click', getUserLocation);

  // ---------- CHIPS & STOPS ----------

  document.querySelectorAll('.fav-chip:not(.geo-chip)').forEach(chip => {
    chip.addEventListener('click', () => {
      const addr = chip.dataset.addr;
      if (!document.getElementById('fromAddr').value) {
        document.getElementById('fromAddr').value = addr;
        clearFieldError('fromAddrField');
      } else {
        document.getElementById('toAddr').value = addr;
        clearFieldError('toAddrField');
      }
      handleAddressInput();
    });
  });

  const addStopBtn = document.getElementById('addStopBtn');
  const viaWrap = document.getElementById('viaWrap');
  addStopBtn.addEventListener('click', () => {
    if (viaWrap.style.display === 'none') {
      viaWrap.style.display = 'block';
      addStopBtn.innerText = '✕ Видалити зупинку';
    } else {
      viaWrap.style.display = 'none';
      document.getElementById('viaAddr').value = '';
      addStopBtn.innerText = '+ Додати зупинку';
      handleAddressInput();
    }
  });

  async function geocode(query) {
    if (!query) return null;
    const fullQuery = query.toLowerCase().includes('умань') ? query : `Умань, ${query}`;
    try {
      const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(fullQuery)}`);
      const data = await res.json();
      if (data && data.length > 0) return [parseFloat(data[0].lat), parseFloat(data[0].lon)];
    } catch(e) { console.error(e); }
    return null;
  }

  async function calculateMultiRoute(waypointCoords) {
    if (waypointCoords.length < 2 || isHourlyMode) return;
    const coordStr = waypointCoords.map(c => `${c[1]},${c[0]}`).join(';');
    const url = `https://router.project-osrm.org/route/v1/driving/${coordStr}?overview=full&geometries=geojson`;

    try {
      const res = await fetch(url);
      const data = await res.json();
      if (data.routes && data.routes.length > 0) {
        const route = data.routes[0];
        const distanceKm = parseFloat((route.distance / 1000).toFixed(1));
        const durationMin = Math.round(route.duration / 60);
        const totalPrice = Math.round(BASE_FARE + (distanceKm * PER_KM));

        lastCalculatedPrice = totalPrice;
        lastRouteSummary = `${distanceKm} км · ~${durationMin} хв`;

        if (routePolyline) map.removeLayer(routePolyline);
        const coords = route.geometry.coordinates.map(c => [c[1], c[0]]);
        routePolyline = L.polyline(coords, { color: '#D4AF37', weight: 4 }).addTo(map);
        map.fitBounds(routePolyline.getBounds(), { padding: [30, 30] });

        document.getElementById('distText').innerText = 'Маршрут розраховано';
        document.getElementById('routeDetails').innerText = lastRouteSummary;
        document.getElementById('priceText').innerText = `${totalPrice} ₴`;
      }
    } catch(e) { console.error(e); }
  }

  function debounce(fn, wait) {
    let t; return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), wait); };
  }

  const handleAddressInput = debounce(async () => {
    if (isHourlyMode) return;
    const valA = document.getElementById('fromAddr').value.trim();
    const valVia = document.getElementById('viaAddr').value.trim();
    const valB = document.getElementById('toAddr').value.trim();

    clearMapLayers();
    const coords = [];
    if (valA) { const pA = await geocode(valA); if (pA) { coords.push(pA); markers.push(L.marker(pA).addTo(map)); } }
    if (viaWrap.style.display !== 'none' && valVia) { const pVia = await geocode(valVia); if (pVia) { coords.push(pVia); markers.push(L.marker(pVia).addTo(map)); } }
    if (valB) { const pB = await geocode(valB); if (pB) { coords.push(pB); markers.push(L.marker(pB).addTo(map)); } }

    if (coords.length >= 2) calculateMultiRoute(coords);
    else if (coords.length === 1) map.setView(coords[0], 15);
  }, 800);

  document.getElementById('fromAddr').addEventListener('input', () => { clearFieldError('fromAddrField'); handleAddressInput(); });
  document.getElementById('viaAddr').addEventListener('input', handleAddressInput);
  document.getElementById('toAddr').addEventListener('input', () => { clearFieldError('toAddrField'); handleAddressInput(); });
  document.getElementById('hourlyFromAddr').addEventListener('input', () => clearFieldError('hourlyFromAddrField'));
  document.getElementById('clientName').addEventListener('input', () => clearFieldError('clientNameField'));
  document.getElementById('clientPhone').addEventListener('input', () => clearFieldError('clientPhoneField'));

  function setFieldError(fieldId, hasError) {
    const field = document.getElementById(fieldId);
    if (!field) return;
    field.classList.toggle('has-error', hasError);
    const input = field.querySelector('input, select');
    if (input) input.classList.toggle('field-error', hasError);
  }
  function clearFieldError(fieldId) { setFieldError(fieldId, false); }

  function isValidPhone(phone) {
    const digits = phone.replace(/[^\d]/g, '');
    return digits.length >= 9 && digits.length <= 15;
  }

  function validateForm() {
    let valid = true;
    if (isHourlyMode) {
      if (!document.getElementById('hourlyFromAddr').value.trim()) { setFieldError('hourlyFromAddrField', true); valid = false; }
    } else {
      if (!document.getElementById('fromAddr').value.trim()) { setFieldError('fromAddrField', true); valid = false; }
      if (!document.getElementById('toAddr').value.trim()) { setFieldError('toAddrField', true); valid = false; }
    }
    if (!document.getElementById('clientName').value.trim()) { setFieldError('clientNameField', true); valid = false; }
    const phone = document.getElementById('clientPhone').value.trim();
    if (!phone || !isValidPhone(phone)) { setFieldError('clientPhoneField', true); valid = false; }
    return valid;
  }

  let toastTimer = null;
  function showToast(msg, err) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.toggle('error', !!err);
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 3200);
  }

  async function sendTelegramMessage(chatId, text) {
    const payload = { chat_id: chatId, text: text, parse_mode: 'HTML' };
    return fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
  }

  const submitBtn = document.getElementById('submitBtn');

  submitBtn.addEventListener('click', async () => {
    if (!validateForm()) {
      showToast('Заповніть обов’язкові поля', true);
      return;
    }

    const orderId = 'APX-' + Math.floor(100000 + Math.random() * 900000);

    const order = {
      id: orderId,
      mode: isHourlyMode ? 'Почасова оренда' : 'За маршрутом',
      from: isHourlyMode ? document.getElementById('hourlyFromAddr').value.trim() : document.getElementById('fromAddr').value.trim(),
      via: (!isHourlyMode && viaWrap.style.display !== 'none') ? document.getElementById('viaAddr').value.trim() : null,
      to: isHourlyMode ? null : document.getElementById('toAddr').value.trim(),
      hours: isHourlyMode ? document.getElementById('hoursSelect').value : null,
      comment: document.getElementById('orderComment').value.trim(),
      clientName: document.getElementById('clientName').value.trim(),
      clientPhone: document.getElementById('clientPhone').value.trim(),
      price: lastCalculatedPrice,
      summary: lastRouteSummary
    };

    // Save user info for future orders
    saveUserData(order.clientName, order.clientPhone, order.from, order.to);

    submitBtn.disabled = true;
    submitBtn.innerText = 'Оформлення...';

    let textDisp = `🚘 <b>НОВЕ ЗАМОВЛЕННЯ ${order.id}</b>\n\n`;
    textDisp += `👤 <b>Клієнт:</b> ${order.clientName}\n`;
    textDisp += `📞 <b>Телефон:</b> ${order.clientPhone}\n`;
    textDisp += `📍 <b>Тип:</b> ${order.mode}\n`;
    textDisp += `📍 <b>Звідки:</b> ${order.from}\n`;
    if (order.via) textDisp += `🛑 <b>Зупинка:</b> ${order.via}\n`;
    if (order.to) textDisp += `🏁 <b>Куди:</b> ${order.to}\n`;
    if (order.hours) textDisp += `⏱ <b>Тривалість:</b> ${order.hours} год.\n`;
    if (order.comment) textDisp += `💬 <b>Коментар:</b> ${order.comment}\n`;
    textDisp += `\n💰 <b>Сума:</b> ${order.price} ₴\n`;
    textDisp += `📊 <b>Деталі:</b> ${order.summary}`;

    const clientChatId = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) ? tg.initDataUnsafe.user.id : null;
    let textClient = `✅ <b>Ваше замовлення ${order.id} прийнято!</b>\n\n`;
    textClient += `📍 <b>Маршрут:</b> ${order.from} → ${order.to || (order.hours + ' год.')}\n`;
    textClient += `💰 <b>Вартість:</b> ${order.price} ₴\n`;
    if (order.comment) textClient += `💬 <b>Коментар:</b> ${order.comment}\n`;
    textClient += `\nДякуємо, що обрали APEX! Водій зв'яжеться з вами найближчим часом.`;

    try {
      await sendTelegramMessage(DISPATCHER_CHAT_ID, textDisp);

      if (clientChatId && clientChatId !== parseInt(DISPATCHER_CHAT_ID)) {
        await sendTelegramMessage(clientChatId, textClient);
      }

      showToast('Замовлення успішно надіслано!');
      setTimeout(() => {
        if (tg) tg.close();
        else { submitBtn.disabled = false; submitBtn.innerText = 'Замовити Apex'; }
      }, 1500);

    } catch (err) {
      console.error(err);
      showToast('Помилка відправки', true);
      submitBtn.disabled = false;
      submitBtn.innerText = 'Замовити Apex';
    }
  });
})();
</script>
</body>
</html>
