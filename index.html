
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>APEX — Преміальні перевезення</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<!-- Leaflet CSS & JS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
  :root{
    --bg-0:#0D0D0D;
    --bg-card: rgba(255,255,255,0.03);
    --border-soft: rgba(255,255,255,0.08);
    --gold-1:#D4AF37;
    --gold-2:#E5C158;
    --platinum:#E5E5E5;
    --text-muted: rgba(229,229,229,0.55);
    --text-faint: rgba(229,229,229,0.35);
    --radius-lg: 20px;
    --radius-md: 14px;
    --radius-sm: 10px;
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}

  html,body{
    margin:0; padding:0;
    background: radial-gradient(circle at 50% 0%, #1a1a1a 0%, var(--bg-0) 55%);
    color: var(--platinum);
    font-family: 'Inter', -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  .app{
    max-width: 560px;
    margin: 0 auto;
    padding: 20px 18px 40px;
  }

  .header{ text-align:center; padding: 10px 0 18px; }
  .logo{
    font-size: 34px; font-weight: 800; letter-spacing: 6px; margin: 0;
    background: linear-gradient(180deg, #F5DE9A 0%, var(--gold-1) 55%, #B8892C 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .tagline{ margin: 4px 0 0; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--text-muted); }

  /* MAP BLOCK */
  .map-card {
    border-radius: var(--radius-lg);
    border: 1px solid var(--border-soft);
    overflow: hidden;
    margin-bottom: 20px;
    position: relative;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  #map {
    width: 100%;
    height: 240px;
    background: #1a1a1a;
  }

  /* FARE CALC BOX */
  .calc-box {
    background: rgba(212,175,55,0.06);
    border: 1px solid rgba(212,175,55,0.2);
    border-radius: var(--radius-md);
    padding: 14px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }
  .calc-info { font-size: 13px; color: var(--text-muted); }
  .calc-info strong { color: #fff; display: block; font-size: 15px; }
  .calc-price { font-size: 22px; font-weight: 800; color: var(--gold-2); }

  /* FORM */
  .form-card{
    border-radius: var(--radius-lg);
    background: var(--bg-card);
    border: 1px solid var(--border-soft);
    padding: 20px 18px;
    margin-bottom: 20px;
  }
  .section-title{
    font-size: 11px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase;
    color: var(--gold-2); margin: 0 0 14px; display:flex; align-items:center; gap: 8px;
  }
  .section-title::after{ content:''; flex:1; height:1px; background: var(--border-soft); }

  .field{ margin-bottom: 14px; }
  .field-label{ display:block; font-size: 11px; font-weight: 500; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; }

  input[type="text"], input[type="tel"], textarea{
    width: 100%; background: rgba(255,255,255,0.035);
    border: 1px solid var(--border-soft); border-radius: var(--radius-sm);
    color: #fff; font-size: 14px; padding: 12px; outline: none;
  }
  input:focus, textarea:focus{ border-color: var(--gold-1); background: rgba(212,175,55,0.05); }

  .field-row{ display:flex; gap: 10px; }
  .field-row .field{ flex:1; }

  .submit-btn{
    width: 100%; border: none; border-radius: var(--radius-md); padding: 16px;
    font-size: 15px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
    color: #1a1300; background: linear-gradient(135deg, #F5DE9A 0%, var(--gold-1) 50%, #C69A2E 100%);
    box-shadow: 0 8px 24px rgba(212,175,55,0.25); cursor: pointer;
  }
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <p class="logo">APEX</p>
    <p class="tagline">Reach the top</p>
  </div>

  <!-- Карта -->
  <div class="map-card">
    <div id="map"></div>
  </div>

  <!-- Расчет стоимости -->
  <div class="calc-box">
    <div class="calc-info">
      <span id="distText">Вкажіть маршрут</span>
      <strong id="routeDetails">0 км · ~0 хв</strong>
    </div>
    <div class="calc-price" id="priceText">0 ₴</div>
  </div>

  <form id="orderForm" class="form-card">
    <p class="section-title">Маршрут</p>
    
    <div class="field">
      <label class="field-label">Звідки (Точка 1)</label>
      <input type="text" id="fromAddr" placeholder="вул. Успенська, 138а">
    </div>

    <div class="field">
      <label class="field-label">Куди (Точка 2)</label>
      <input type="text" id="toAddr" placeholder="вул. Гостинна, 1">
    </div>

    <p class="section-title" style="margin-top:20px;">Контакти</p>
    <div class="field-row">
      <div class="field">
        <label class="field-label">Ім'я</label>
        <input type="text" id="clientName" placeholder="Ваше ім'я">
      </div>
      <div class="field">
        <label class="field-label">Телефон</label>
        <input type="tel" id="clientPhone" placeholder="+380...">
      </div>
    </div>
  </form>

  <button type="button" class="submit-btn" id="submitBtn">Замовити Apex</button>
</div>

<script>
(function(){
  const BASE_FARE = 80;   // Подача авто (грн)
  const PER_KM = 20;       // Вартість за 1 км (грн)
  const UMAN_COORDS = [48.7484, 30.2218]; // Центр Умані

  // Инициализация карты Leaflet
  const map = L.map('map').setView(UMAN_COORDS, 13);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
    maxZoom: 19,
    attribution: '© OpenStreetMap'
  }).addTo(map);

  let markerA = null, markerB = null, routePolyline = null;
  let coordA = null, coordB = null;

  // Функция автокодирования адреса в координаты через Nominatim OSM
  async function geocode(query) {
    if (!query) return null;
    const fullQuery = query.toLowerCase().includes('умань') ? query : `Умань, ${query}`;
    try {
      const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(fullQuery)}`);
      const data = await res.json();
      if (data && data.length > 0) {
        return [parseFloat(data[0].lat), parseFloat(data[0].lon)];
      }
    } catch(e) { console.error(e); }
    return null;
  }

  // Запрос маршрута и расстояния OSRM
  async function calculateRoute() {
    if (!coordA || !coordB) return;

    const url = `https://router.project-osrm.org/route/v1/driving/${coordA[1]},${coordA[0]};${coordB[1]},${coordB[0]}?overview=full&geometries=geojson`;
    try {
      const res = await fetch(url);
      const data = await res.json();
      if (data.routes && data.routes.length > 0) {
        const route = data.routes[0];
        const distanceKm = (route.distance / 1000).toFixed(1);
        const durationMin = Math.round(route.duration / 60);
        
        // Расчет цены
        const totalPrice = Math.round(BASE_FARE + (distanceKm * PER_KM));

        // Отрисовка линии маршрута
        if (routePolyline) map.removeLayer(routePolyline);
        const coords = route.geometry.coordinates.map(c => [c[1], c[0]]);
        routePolyline = L.polyline(coords, { color: '#D4AF37', weight: 4 }).addTo(map);
        map.fitBounds(routePolyline.getBounds(), { padding: [30, 30] });

        // Обновление UI
        document.getElementById('distText').innerText = 'Розраховано маршрут';
        document.getElementById('routeDetails').innerText = `${distanceKm} км · ~${durationMin} хв`;
        document.getElementById('priceText').innerText = `${totalPrice} ₴`;
      }
    } catch(e) { console.error(e); }
  }

  // Дебаунс для ввода адресов
  function debounce(fn, wait) {
    let t; return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), wait); };
  }

  const handleAddressInput = debounce(async () => {
    const valA = document.getElementById('fromAddr').value.trim();
    const valB = document.getElementById('toAddr').value.trim();

    if (valA) {
      const posA = await geocode(valA);
      if (posA) {
        coordA = posA;
        if (markerA) map.removeLayer(markerA);
        markerA = L.marker(coordA).addTo(map).bindPopup('A: ' + valA);
      }
    }
    if (valB) {
      const posB = await geocode(valB);
      if (posB) {
        coordB = posB;
        if (markerB) map.removeLayer(markerB);
        markerB = L.marker(coordB).addTo(map).bindPopup('B: ' + valB);
      }
    }

    if (coordA && coordB) calculateRoute();
  }, 800);

  document.getElementById('fromAddr').addEventListener('input', handleAddressInput);
  document.getElementById('toAddr').addEventListener('input', handleAddressInput);
})();
</script>
</body>
</html>
